services:
  - type: web
    name: modedsms-bot
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: python3 -u bot.py
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: BOT_TOKEN
        sync: false
      - key: SASTASMS_API_KEY
        sync: false
      - key: CRYPTO_PAY_TOKEN
        sync: false
      - key: COLOUR_TRADING_PRICE
        value: "20.0"
